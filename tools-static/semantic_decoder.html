<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Word Sequence Decoder</title>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; line-height: 1.6; background: #f4f4f9; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; }
        #status { font-style: italic; color: #666; margin-top: 5px; }
        #output { margin-top: 20px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; min-height: 50px; }
        .word-tag { display: inline-block; background: #e0f0ff; padding: 4px 8px; margin: 4px; border-radius: 4px; font-weight: bold; border: 1px solid #b3d7ff; }
        .index { font-size: 0.8em; color: #888; margin-right: 5px; }
    </style>
</head>
<body>

    <h2>Semantic Sequence Decoder</h2>
    <p>This tool iteratively removes the word most similar to the current paragraph's embedding.</p>

    <textarea id="inputText">Artificial Intelligence is transforming the way we work and live in the modern world.</textarea>
    <br>
    <button id="runBtn">Load Model & Extract Sequence</button>
    <div id="status">Ready. (First run will download ~23MB model)</div>

    <h3>Extracted Sequence:</h3>
    <div id="output">Words will appear here...</div>

    <script type="module">
        import { pipeline, dot } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        let extractor;
        const runBtn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const inputText = document.getElementById('inputText');

        // Simple Cosine Similarity (assuming normalized vectors)
        function cosineSimilarity(vecA, vecB) {
            return dot(vecA, vecB);
        }

        async function init() {
            if (!extractor) {
                status.innerText = "Downloading model (all-MiniLM-L6-v2)...";
                extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
                status.innerText = "Model loaded!";
            }
        }

        runBtn.addEventListener('click', async () => {
            runBtn.disabled = true;
            await init();
            
            output.innerHTML = "";
            let words = inputText.value.match(/\b(\w+)\b/g); 
            if (!words) return;

            status.innerText = "Processing sequence...";

            let sequence = [];
            
            // Iterative Removal Loop
            while (words.length > 0) {
                const currentPara = words.join(" ");
                
                // 1. Get embedding of current "paragraph"
                const paraOutput = await extractor(currentPara, { pooling: 'mean', normalize: true });
                const paraVector = paraOutput.data;

                let bestSimilarity = -1;
                let bestIndex = -1;

                // 2. Compare each word to the current paragraph embedding
                // Note: We embed each word individually to find the closest one
                for (let i = 0; i < words.length; i++) {
                    const wordOutput = await extractor(words[i], { pooling: 'mean', normalize: true });
                    const wordVector = wordOutput.data;
                    const sim = cosineSimilarity(paraVector, wordVector);

                    if (sim > bestSimilarity) {
                        bestSimilarity = sim;
                        bestIndex = i;
                    }
                }

                // 3. Remove the closest word and add to sequence
                const removedWord = words.splice(bestIndex, 1)[0];
                sequence.push(removedWord);

                // Update UI live
                const span = document.createElement('span');
                span.className = 'word-tag';
                span.innerHTML = `<span class="index">${sequence.length}</span>${removedWord}`;
                output.appendChild(span);
            }

            status.innerText = "Done!";
            runBtn.disabled = false;
        });
    </script>
</body>
</html>
