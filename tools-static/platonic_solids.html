        };
        const getCube = () => { const v = []; for (let x of [-1,1]) for (let y of [-1,1]) for (let z of [-1,1]) v.push(norm([x,y,z])); return v; };
        const getOcta = () => [norm([1,0,0]), norm([-1,0,0]), norm([0,1,0]), norm([0,-1,0]), norm([0,0,1]), norm([0,0,-1])];
        const getTetra = () => [norm([1,1,1]), norm([1,-1,-1]), norm([-1,1,-1]), norm([-1,-1,1])];

        const applyRot = (pts, a) => {
            const m = new THREE.Matrix4();
            m.multiply(new THREE.Matrix4().makeRotationZ(a[2]));
            m.multiply(new THREE.Matrix4().makeRotationY(a[1]));
            m.multiply(new THREE.Matrix4().makeRotationX(a[0]));
            return pts.map(p => p.clone().applyMatrix4(m));
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(2, 2, 2);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        scene.add(light);

        let compoundGroup = new THREE.Group();
        scene.add(compoundGroup);

        const solidMeshes = {};
        const colors = { Dodeca: 0xff4444, Icosa: 0x44ff44, Cube: 0x4444ff, Octa: 0xffff44, Tetra: 0xff44ff };

        function updateGeometry() {
            compoundGroup.clear();
            const selectedSet = ANGLE_SETS[document.getElementById('angleSelect').value];
            
            const rawSolids = [
                { name: "Dodeca", pts: getDodeca() },
                { name: "Icosa",  pts: applyRot(getIcosa(), selectedSet.slice(0, 3)) },
                { name: "Cube",   pts: applyRot(getCube(), selectedSet.slice(3, 6)) },
                { name: "Octa",   pts: applyRot(getOcta(), selectedSet.slice(6, 9)) },
                { name: "Tetra",  pts: applyRot(getTetra(), selectedSet.slice(9, 12)) }
            ];

            const allActivePoints = [];

            rawSolids.forEach(data => {
                const solidContainer = new THREE.Group();
                solidContainer.name = data.name;

                // Convex Hull
                const geom = new ConvexGeometry(data.pts);
                const mat = new THREE.MeshPhongMaterial({ color: colors[data.name], transparent: true, opacity: 0.3, side: THREE.DoubleSide });
                solidContainer.add(new THREE.Mesh(geom, mat));
                
                // Edges
                const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: colors[data.name], opacity: 0.5, transparent: true }));
                solidContainer.add(wire);

                // Vertices
                data.pts.forEach(p => {
                    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), new THREE.MeshBasicMaterial({ color: colors[data.name] }));
                    dot.position.copy(p);
                    solidContainer.add(dot);
                    allActivePoints.push(p);
                });

                solidMeshes[data.name] = solidContainer;
                compoundGroup.add(solidContainer);
                
                // Set visibility based on checkbox
                const cb = document.getElementById(`cb-${data.name}`);
                if (cb) solidContainer.visible = cb.checked;
            });

            calculateMinDist(allActivePoints);
        }

        function calculateMinDist(pts) {
            let minD = Infinity;
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const d = pts[i].distanceTo(pts[j]);
                    if (d < minD) minD = d;
                }
            }
            document.getElementById('distDisplay').innerText = `Min Distance: ${minD.toFixed(8)}`;
        }

        // --- UI BUILDING ---
        const names = ["Dodeca", "Icosa", "Cube", "Octa", "Tetra"];
        const cbContainer = document.getElementById('checkboxes');
        names.forEach(name => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `<input type="checkbox" id="cb-${name}" checked> <span style="color:${colors[name].toString(16).padStart(6,'0')}">■</span> ${name}`;
            cbContainer.appendChild(div);
            div.querySelector('input').addEventListener('change', (e) => {
                solidMeshes[name].visible = e.target.checked;
            });
        });

        document.getElementById('angleSelect').addEventListener('change', updateGeometry);

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            compoundGroup.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        updateGeometry();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
