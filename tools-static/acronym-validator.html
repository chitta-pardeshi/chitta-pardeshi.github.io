    <meta charset="UTF-8">
    <title>Acronym Validator</title>
    <script>
    function validate(str, dict, set) {
      if (str) {
        var m = -1 ;
        var mstr = "";
        for (var i=0; i < dict.length; i++) {
          m = str.indexOf(dict[i]) ;
          if (m >= 0) {
            mstr = dict[i];
            break;
          }
        }
        if (m < 0) {
          if (set.indexOf(str) < 0) {
            set.push(str);
          }
          return '[' + str + ']';
        }
        var lhs = str.substring(0, m);
        var rhs = str.substring(m+mstr.length);
        if (lhs) {
          if (rhs) {
            return validate(lhs, dict, set) + '-' + mstr + '-' + validate(rhs, dict, set);
          } else {
            return validate(lhs, dict, set) + '-' + mstr;
          }
        } else {
          if (rhs) {
            return  mstr + '-' + validate(rhs, dict, set);
          } else {
            return mstr;
          }
        }
      } else {
        return "";
      }
    }

    function loadText(str, asdictionary) {
      var array = []
      var lines = str.trim().split(/\r?\n/);
      for (var i=0; i < lines.length; i++) {
        var line = lines[i].trim().toLowerCase();
        if (asdictionary) {
          if (line) {
            array.push(line);
          }
        } else {
          array.push(line);
        }
      }
      if (asdictionary) {
        array.sort(function (a, b) {
          if (b.length == a.length) {
            return b.localeCompare(a);
          } else {
            return b.length - a.length;
          }
        });
      }
      return array;
    }

    function validateFunction() {
      var dict = loadText(document.getElementById("dictionary").value, 1) ;
      var seta = loadText(document.getElementById("seta").value, 0);
      var setb = [];
      var setc = [];
      for (var i = 0; i < seta.length; i++) {
        setb.push(validate(seta[i], dict, setc))
      }
      document.getElementById("setb").value = setb.join('\r\n');
      document.getElementById("setc").value = setc.join('\r\n');
    }
    </script>
