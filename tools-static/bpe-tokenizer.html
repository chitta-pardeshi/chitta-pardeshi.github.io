<!DOCTYPE html>
<html lang="en">
<head>
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-DDEYGY86R8"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
      
        gtag('config', 'G-DDEYGY86R8');

    <meta charset="UTF-8">
    <title>BPE Lab: JSON State</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 1100px; }
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 350px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 13px; background: #fafafa; }
        .controls { margin-bottom: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; display: flex; gap: 15px; align-items: center; }
        button { padding: 10px 18px; cursor: pointer; border-radius: 6px; border: none; font-weight: 600; transition: 0.2s; }
        .btn-train { background: #2ecc71; color: white; }
        .btn-run { background: #3498db; color: white; }
        .btn-io { background: #9b59b6; color: white; }
        .token-out { margin-top: 20px; padding: 15px; background: #1e1e1e; color: #a6e22e; border-radius: 6px; min-height: 80px; font-family: monospace; line-height: 2.2; word-break: break-all; }
        .t { background: #333; border: 1px solid #444; padding: 3px 6px; margin: 2px; border-radius: 4px; display: inline-block; color: #66d9ef; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>BPE Tokenizer (JSON State)</h2>
    
    <div class="controls">
        <div>
            <strong>Merges:</strong>
            <input type="number" id="iterations" value="5" min="1" style="width: 50px; padding: 5px;">
            <button class="btn-train" onclick="runBPE(true)">Train More</button>
            <button class="btn-run" onclick="runBPE(false)">Tokenize Only</button>
        </div>
        <div style="border-left: 1px solid #ddd; padding-left: 15px;">
            <button class="btn-io" onclick="downloadJSON()">Download JSON</button>
            <button style="background:#e74c3c; color:white;" onclick="resetVocab()">Reset</button>
        </div>
    </div>

    <div class="layout">
        <div>
            <div class="label-row">Training Data</div>
            <textarea id="data">learning to learn with bpe tokenization.</textarea>
        </div>
        <div>
            <div class="label-row">
                <span>Vocabulary (JSON)</span>
                <span id="vocabCount" style="font-weight:normal; font-size: 0.8em;">0 tokens</span>
            </div>
            <textarea id="vocab" placeholder='[]'></textarea>
        </div>
    </div>

    <div class="label-row" style="margin-top: 20px;">Tokenized Output</div>
    <div id="output" class="token-out"></div>
</div>

<script>
    function runBPE(isTraining) {
        const dataText = document.getElementById('data').value;
        const vocabArea = document.getElementById('vocab');
        
        // Load JSON safely
        let currentVocab = [];
        try {
            const content = vocabArea.value.trim();
            currentVocab = content ? JSON.parse(content) : [];
        } catch(e) {
            alert("Invalid JSON in vocabulary box!");
            return;
        }
        
        // 1. Initial State: Chars + EOW marker
        let words = dataText.split(/\s+/).map(w => w.split('').concat(['</w>']));

        // 2. Apply existing JSON rules in sequence
        currentVocab.forEach(rule => {
            words = applyRule(words, rule.pair, rule.merged);
        });

        // 3. Training Logic
        if (isTraining) {
            let iterations = parseInt(document.getElementById('iterations').value);
            for (let i = 0; i < iterations; i++) {
                let stats = getStats(words);
                let bestPairKey = findBestPair(stats);
                
                if (!bestPairKey) break;
                
                let pairParts = bestPairKey.split(',');
                let mergedToken = pairParts.join('');
                
                // Add to JSON structure
                currentVocab.push({
                    id: currentVocab.length,
                    pair: pairParts,
                    merged: mergedToken
                });
                
                words = applyRule(words, pairParts, mergedToken);
            }
            vocabArea.value = JSON.stringify(currentVocab, null, 2);
        }

        render(words);
        document.getElementById('vocabCount').innerText = currentVocab.length + " rules";
    }

    function getStats(words) {
        let stats = {};
        words.forEach(word => {
            for (let i = 0; i < word.length - 1; i++) {
                let pair = word[i] + ',' + word[i+1];
                stats[pair] = (stats[pair] || 0) + 1;
            }
        });
        return stats;
    }

    function findBestPair(stats) {
        let maxFreq = 0, best = null;
        for (let pair in stats) {
            if (stats[pair] > maxFreq) {
                maxFreq = stats[pair];
                best = pair;
            }
        }
        return best;
    }

    function applyRule(words, pair, merged) {
        return words.map(word => {
            let newWord = [];
            let i = 0;
            while (i < word.length) {
                if (i < word.length - 1 && word[i] === pair[0] && word[i+1] === pair[1]) {
                    newWord.push(merged);
                    i += 2;
                } else {
                    newWord.push(word[i]);
                    i++;
                }
            }
            return newWord;
        });
    }

    function render(words) {
        const out = document.getElementById('output');
        out.innerHTML = words.map(w => 
            w.map(t => `<span class="t">${t}</span>`).join('')
        ).join(' &nbsp; ');
    }

    function downloadJSON() {
        const text = document.getElementById('vocab').value;
        const blob = new Blob([text], { type: 'application/json' });
        const anchor = document.createElement('a');
        anchor.download = "bpe_model.json";
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
    }

    function resetVocab() {
        if(confirm("Wipe JSON vocabulary?")) {
            document.getElementById('vocab').value = '[]';
            runBPE(false);
        }
    }
</script>
</body>
</html>
