          color: color===null ? 0xffffff : color, vertexColors: color===null,
          transparent: opacity < 1, opacity, side: THREE.DoubleSide, flatShading: !!flat,
          shininess: 40, specular: 0x222222 });
        return new THREE.Mesh(ng, m);
      }
      function linesFromIndex(idx, color, opacity){
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(POS.slice(), 3));
        g.setIndex(idx);
        return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
          color, transparent:true, opacity, depthWrite:false }));
      }
      function ghostSphere(r, op){
        return new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32),
          new THREE.MeshBasicMaterial({ color:0x223344, wireframe:true, transparent:true, opacity:op }));
      }
      function bind(id, fn){ const el=document.getElementById(id); if(el) el.addEventListener('change', e=>fn(e.target.checked)); }


      const FAMNAME = ['tetrahedron','cube','octahedron','dodecahedron','icosahedron'];
      const solidObjs = [];
      const solidsG = new THREE.Group();
      for (let s=0; s<DATA.sf.length; s++){
        const k = DATA.sf[s];
        const g = new THREE.Group();
        const mesh = meshFromIndex(DATA.st[s], FAMCOL[k], 0.10, false);
        const line = linesFromIndex(DATA.se[s], FAMCOL[k], 0.45);
        g.add(mesh, line); solidsG.add(g);
        solidObjs.push({ g, mesh, line, fam:k });
      }
      const st = { fam:[true,true,true,true,true], solo:0, faceOp:0.10,
                   faces:true, edges:true, pts:true, mode:'solids' };
      function applySolids(){
        for (let s=0; s<solidObjs.length; s++){
          const o = solidObjs[s];
          const hot = st.solo === s+1;
          o.g.visible = st.fam[o.fam] && (st.solo === 0 || hot);
          o.mesh.visible = st.faces;
          o.line.visible = st.edges;
          o.mesh.material.opacity = hot ? Math.min(0.5, st.faceOp*2.5 + 0.22) : st.faceOp;
          o.line.material.opacity = hot ? 0.95 : 0.45;
        }
        const el = document.getElementById('soloLab');
        if (el) el.textContent = st.solo === 0 ? 'all 81'
              : ('#' + (st.solo-1) + ' ' + FAMNAME[DATA.sf[st.solo-1]]);
      }
      function filterPoints(pts){
        const p=[],c=[];
        for (let i=0;i<600;i++){
          if (!st.fam[DATA.fam[i]]) continue;
          if (st.solo !== 0 && DATA.sol[i] !== st.solo-1) continue;
          p.push(POS[i*3],POS[i*3+1],POS[i*3+2]);
          c.push(COL[i*3],COL[i*3+1],COL[i*3+2]);
        }
        pts.geometry.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
        pts.geometry.setAttribute('color', new THREE.Float32BufferAttribute(c,3));
        const el = document.getElementById('cnt'); if (el) el.textContent = p.length/3;
      }

      const grp = new THREE.Group(); scene.add(grp);
      const hullG = new THREE.Group();
      const shell = meshFromIndex(DATA.hull, null, 1.0, true);
      const hullWire = linesFromIndex((()=>{ const s=new Set(),o=[];
          for(let i=0;i<DATA.hull.length;i+=3){ const t=[DATA.hull[i],DATA.hull[i+1],DATA.hull[i+2]];
            for(const [a,b] of [[0,1],[1,2],[2,0]]){ const k=Math.min(t[a],t[b])+'_'+Math.max(t[a],t[b]);
              if(!s.has(k)){ s.add(k); o.push(t[a],t[b]); } } }
          return o; })(), 0x000000, 0.5);
      hullG.add(shell, hullWire);
      const pts = pointsCloud(0.028, 0.95);
      const gs = ghostSphere(0.985, 0.08); gs.visible = false;
      grp.add(solidsG, hullG, pts); scene.add(gs);

      function apply(){
        solidsG.visible = st.mode === 'solids';
        hullG.visible   = st.mode === 'hull';
        applySolids();
        pts.visible = st.pts;
        filterPoints(pts);
      }
      document.querySelectorAll('input[name=mode]').forEach(r =>
        r.addEventListener('change', e => { st.mode = e.target.value; apply(); }));
      for(let k=0;k<5;k++) bind('f'+k, v => { st.fam[k]=v; apply(); });
      bind('showPts', v => { st.pts=v; apply(); });
      bind('showSphere', v => gs.visible = v);
      bind('spin', v => controls.autoRotate = v);
      document.getElementById('solo').addEventListener('input', e => {
        st.solo = +e.target.value; apply(); });
      document.getElementById('op').addEventListener('input', e => {
        st.faceOp = +e.target.value/100; apply(); });
      apply();

loop();
</script>
</body>
</html>
