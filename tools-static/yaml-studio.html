<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Multi-Doc YAML Editor (JSON-safe)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
--accent:#0078d4; --bg-dark:#1e1e1e; --fg-dark:#dcdcdc; --panel-border:#ddd;
--indent:18px; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh;overflow:hidden}
#left-panel{width:34%;min-width:320px;border-right:2px solid var(--panel-border);display:flex;flex-direction:column;background:var(--bg-dark)}
#right-panel{flex:1;display:flex;flex-direction:column;background:#fff}
.titlebar{color:#aaa;padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;justify-content:space-between}
.titlebar .hint{font-weight:600;color:#7f7f7f}
textarea{flex:1;padding:14px;font-family:var(--mono);border:none;color:var(--fg-dark);background:transparent;outline:none;font-size:12px;line-height:1.35;resize:none}

.doc-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #e5e5e5;background:#f6f6f6}
.doc-counter{font-size:13px;font-weight:800;color:#333;margin-right:8px}
.nav-btn{cursor:pointer;padding:6px 12px;border:1px solid #cfcfcf;background:#fff;border-radius:6px;font-weight:800;font-size:12px}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
/* Fallback first */
.nav-btn.primary{border-color:#9cc7e8;color:var(--accent)}
@supports (border-color: color-mix(in srgb, #000 50%, #fff)) {
.nav-btn.primary{border-color:color-mix(in srgb,var(--accent) 50%,#cfcfcf)}
}
.nav-btn.danger{border-color:#e4b4b4;color:#a52828}
.spacer{flex:1}

#status{padding:8px 12px;border-bottom:1px solid #eee;font-size:12px;display:none;white-space:pre-wrap;font-family:var(--mono)}
#status.err{display:block;background:#fff1f1;color:#8a1f1f;border-bottom-color:#ffd0d0}
#status.ok{display:block;background:#f2fff5;color:#1f6b2c;border-bottom-color:#c9f0d2}

#ui-root{flex:1;overflow:auto;padding:16px 14px 24px}
.node{margin-left:var(--indent);border-left:1px solid #f0f0f0;padding-left:10px;margin-top:6px}
.row{display:flex;align-items:center;gap:8px;padding:2px 0}
.btn-ico{border:none;background:none;cursor:pointer;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:#a9a9a9;border-radius:4px}
.btn-ico:hover{background:#f0f0f0;color:#333}
.btn-ico.danger:hover{background:#ffecec;color:#d73a49}

.key-input{font-weight:800;font-size:12px;color:#333;border:1px solid transparent;border-radius:4px;padding:3px 5px;min-width:90px;max-width:260px}
.key-input:focus{outline:none;border-color:#d0d0d0;background:#fff}

.type-pill{font-size:11px;font-weight:900;color:#666;background:#efefef;border:1px solid #e0e0e0;padding:2px 6px;border-radius:999px;user-select:none}
.val-input,.val-textarea{font-family:var(--mono);flex:1;border:1px solid #ddd;padding:6px 7px;border-radius:6px;font-size:12px;max-width:720px;min-width:180px}
.val-textarea{min-height:60px;resize:vertical}

.small{font-size:11px;color:#666}
.toolbar{display:flex;align-items:center;gap:8px;margin:10px 0 12px 0;padding:10px;border:1px solid #eee;border-radius:10px;background:#fbfbfb;max-width:980px}
.toolbar label{font-size:12px;font-weight:900;color:#333}
.toolbar select,.toolbar input[type="text"]{font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid #ddd}
.muted{color:#777;font-size:12px}
</style>
</head>
<body>

<div id="left-panel">
<div class="titlebar">
<div>SOURCE (MULTI-DOC)</div>
<div class="hint">Edit YAML here or use the UI →</div>
</div>
<textarea id="yaml-source" spellcheck="false">---
kind: unknown
id: "001"
name: First Document
---
kind: unknown
id: "002"
name: Second Document
tags: [config, prod]
</textarea>
</div>

<div id="right-panel">
<nav class="doc-nav">
<button class="nav-btn" id="prevBtn">← Previous</button>
<div class="doc-counter" id="docCounter">Document 1 of 1</div>
<button class="nav-btn" id="nextBtn">Next →</button>

<div class="spacer"></div>

<button class="nav-btn primary" id="newDocBtn">+ New Doc</button>
<button class="nav-btn danger" id="delDocBtn">Delete Doc</button>
<button class="nav-btn" id="formatBtn">Format YAML</button>
</nav>

<div id="status"></div>
<div id="ui-root"></div>
</div>

<script>
(() => {
const OPTIONS = {
// User choices
keepLeadingZeroNumbersAsString: true,
newDocTemplate: { kind: "unknown" },

// Behavior
prependDocSeparatorAlways: true,
syncDebounceMs: 150,
dumpIndent: 2,
dumpLineWidth: 120,

// Consistency choice: DO NOT parse inline "{...}" or "[...]" strings into objects/lists.
enableInlineYamlParseForBrackets: false
};

const source = document.getElementById("yaml-source");
const uiRoot = document.getElementById("ui-root");
const status = document.getElementById("status");
const docCounter = document.getElementById("docCounter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const newDocBtn = document.getElementById("newDocBtn");
const delDocBtn = document.getElementById("delDocBtn");
const formatBtn = document.getElementById("formatBtn");

// Compatibility: structuredClone fallback
const clone = (x) => (window.structuredClone ? structuredClone(x) : JSON.parse(JSON.stringify(x)));

let allDocs = [];
let currentIndex = 0;
let syncTimer = null;
let suppressSourceListener = false;

function setStatus(kind, msg) {
if (!msg) {
status.className = "";
status.style.display = "none";
status.textContent = "";
return;
}
status.className = kind === "err" ? "err" : "ok";
status.style.display = "block";
status.textContent = msg;
}

function isPlainObject(v) {
return v !== null && typeof v === "object" && !Array.isArray(v) &&
Object.prototype.toString.call(v) === "[object Object]";
}

function inferTypeLabel(v) {
if (v === null) return "null";
if (Array.isArray(v)) return "list";
if (isPlainObject(v)) return "map";
return typeof v;
}

// Ensure JSON-safe values (no Date/undefined/function/BigInt/etc.)
function normalizeToJsonSafe(v) {
if (v === null) return null;

const t = typeof v;
if (t === "string" || t === "number" || t === "boolean") return v;

if (Array.isArray(v)) return v.map(normalizeToJsonSafe);

if (isPlainObject(v)) {
const out = {};
for (const k of Object.keys(v)) out[String(k)] = normalizeToJsonSafe(v[k]);
return out;
}

// Fallback for non-JSON types: stringify
try { return String(v); } catch { return null; }
}

function parseScalarFromString(input) {
if (typeof input !== "string") return input;
const raw = input;
const s = raw.trim();

if (s === "") return ""; // keep empty string
if (s === "null" || s === "Null" || s === "NULL" || s === "~") return null;
if (s === "true" || s === "True" || s === "TRUE") return true;
if (s === "false" || s === "False" || s === "FALSE") return false;

const looksInt = /^[-+]?\d+$/.test(s);
const looksFloat =
/^[-+]?(\d+\.\d*|\d*\.\d+)([eE][-+]?\d+)?$/.test(s) ||
/^[-+]?\d+([eE][-+]?\d+)$/.test(s);

if (looksInt) {
if (OPTIONS.keepLeadingZeroNumbersAsString) {
const hasLeadingZero =
(s.length > 1 && s[0] === "0") ||
(s.length > 2 && (s.startsWith("-0") || s.startsWith("+0")));
if (hasLeadingZero) return raw;
}
const n = Number(s);
if (Number.isSafeInteger(n)) return n;
return raw;
}

if (looksFloat) {
const n = Number(s);
if (Number.isFinite(n)) return n;
return raw;
}

if (OPTIONS.enableInlineYamlParseForBrackets) {
if ((s.startsWith("[") && s.endsWith("]")) || (s.startsWith("{") && s.endsWith("}"))) {
try {
const vv = jsyaml.load(s, { schema: jsyaml.JSON_SCHEMA });
return normalizeToJsonSafe(vv);
} catch { /* ignore */ }
}
}

return raw;
}

function dumpDoc(doc) {
const safe = normalizeToJsonSafe(doc);
const txt = jsyaml.dump(safe, {
indent: OPTIONS.dumpIndent,
lineWidth: OPTIONS.dumpLineWidth,
noRefs: true,
sortKeys: false,
schema: jsyaml.JSON_SCHEMA
}).trimEnd();
return txt.length ? txt : "{}";
}

function serializeAllDocs() {
const parts = allDocs.map(dumpDoc);
let joined = parts.join("\n---\n");
if (OPTIONS.prependDocSeparatorAlways) joined = "---\n" + joined;
return joined.trimEnd() + "\n";
}

function syncToSource() {
const text = serializeAllDocs();
suppressSourceListener = true;
source.value = text;
suppressSourceListener = false;
}

function scheduleSync() {
clearTimeout(syncTimer);
syncTimer = setTimeout(() => {
syncTimer = null;
syncToSource();
}, OPTIONS.syncDebounceMs);
}

function safeCurrentDoc() {
if (allDocs.length === 0) allDocs = [clone(OPTIONS.newDocTemplate)];
if (currentIndex < 0) currentIndex = 0;
if (currentIndex >= allDocs.length) currentIndex = allDocs.length - 1;
return allDocs[currentIndex];
}

function refreshFromSource() {
if (suppressSourceListener) return;
try {
const docs = jsyaml.loadAll(source.value, undefined, { schema: jsyaml.JSON_SCHEMA });

// Keep explicit null docs; only filter undefined
const cleaned = (docs || []).filter(d => d !== undefined).map(normalizeToJsonSafe);

allDocs = cleaned.length ? cleaned : [clone(OPTIONS.newDocTemplate)];
if (currentIndex >= allDocs.length) currentIndex = allDocs.length - 1;
if (currentIndex < 0) currentIndex = 0;

setStatus("", "");
updateUI();
} catch (e) {
setStatus("err", "YAML parse error:\n" + (e && e.message ? e.message : String(e)));
}
}

function updateNav() {
docCounter.textContent = `Document ${currentIndex + 1} of ${allDocs.length}`;
prevBtn.disabled = currentIndex === 0;
nextBtn.disabled = currentIndex === allDocs.length - 1;
delDocBtn.disabled = allDocs.length <= 1;
}

function makeIconButton(txt, title, onClick, danger=false) {
const b = document.createElement("button");
b.type = "button";
b.className = "btn-ico" + (danger ? " danger" : "");
b.textContent = txt;
b.title = title;
b.onclick = onClick;
return b;
}

function makeScalarEditor(value, onChange) {
const isStr = typeof value === "string";
const isMultiline = isStr && value.includes("\n");
if (isMultiline) {
const ta = document.createElement("textarea");
ta.className = "val-textarea";
ta.value = value;
ta.oninput = (e) => onChange(e.target.value);
return ta;
}
const input = document.createElement("input");
input.className = "val-input";
input.value = value === undefined ? "" : (value === null ? "null" : String(value));
input.placeholder = "value";
input.oninput = (e) => onChange(parseScalarFromString(e.target.value));
return input;
}

function renderScalarRoot(container, value) {
const box = document.createElement("div");
box.className = "node";
box.style.marginLeft = "0";

const row = document.createElement("div");
row.className = "row";

const pill = document.createElement("span");
pill.className = "type-pill";
pill.textContent = inferTypeLabel(value);

const input = document.createElement("input");
input.className = "val-input";
input.style.maxWidth = "980px";
input.value = value === undefined ? "" : (value === null ? "null" : String(value));
input.placeholder = "Enter a root value";
input.oninput = (e) => {
allDocs[currentIndex] = normalizeToJsonSafe(parseScalarFromString(e.target.value));
scheduleSync();
updateNav();
};

row.appendChild(pill);
row.appendChild(input);
box.appendChild(row);
container.appendChild(box);
}

function renderObject(obj, container) {
const keys = Object.keys(obj);
if (keys.length === 0) {
const empty = document.createElement("div");
empty.className = "node";
empty.style.marginLeft = "0";
empty.innerHTML = `<span class="small">(empty map)</span>`;
container.appendChild(empty);
return;
}

for (const key of keys) {
const node = document.createElement("div");
node.className = "node";

const row = document.createElement("div");
row.className = "row";

row.appendChild(makeIconButton("✕", "Delete key", () => {
delete obj[key];
syncToSource();
updateUI();
}, true));

const keyInput = document.createElement("input");
keyInput.className = "key-input";
keyInput.value = key;
keyInput.title = "Rename key (press Enter)";
keyInput.onkeydown = (ev) => {
if (ev.key === "Enter") keyInput.blur();
if (ev.key === "Escape") { keyInput.value = key; keyInput.blur(); }
};

keyInput.onblur = () => {
const newKey = keyInput.value.trim();
if (!newKey || newKey === key) { keyInput.value = key; return; }
if (Object.prototype.hasOwnProperty.call(obj, newKey)) {
setStatus("err", `Rename failed: key "${newKey}" already exists.`);
keyInput.value = key;
return;
}
obj[newKey] = obj[key];
delete obj[key];
setStatus("", "");
syncToSource();
updateUI();
};

row.appendChild(keyInput);
row.appendChild(document.createElement("span")).textContent = ":";

const v = obj[key];
const pill = document.createElement("span");
pill.className = "type-pill";
pill.textContent = inferTypeLabel(v);
row.appendChild(pill);

if (Array.isArray(v)) {
node.appendChild(row);
const sub = document.createElement("div");
renderArray(v, sub, null);
node.appendChild(sub);
} else if (isPlainObject(v)) {
node.appendChild(row);
const sub = document.createElement("div");
renderObject(v, sub);
node.appendChild(sub);
} else {
const input = makeScalarEditor(v, (newVal) => {
obj[key] = normalizeToJsonSafe(newVal);
scheduleSync();
});
row.appendChild(input);
node.appendChild(row);
}

container.appendChild(node);
}
}

function renderArray(arr, container, labelText=null) {
const wrap = document.createElement("div");
wrap.className = "node";
wrap.style.marginLeft = "0";

const header = document.createElement("div");
header.className = "row";

const lbl = document.createElement("span");
lbl.className = "key-input";
lbl.style.border = "1px solid #eee";
lbl.style.background = "#fff";
lbl.style.color = "#444";
lbl.style.fontWeight = "900";
lbl.textContent = (labelText ? labelText + " " : "") + `[${arr.length}]`;
lbl.style.minWidth = "120px";
header.appendChild(lbl);

header.appendChild(makeIconButton("+", "Add item", () => {
arr.push("");
syncToSource();
updateUI();
}));

wrap.appendChild(header);

if (arr.length === 0) {
const empty = document.createElement("div");
empty.className = "small";
empty.style.marginLeft = "24px";
empty.textContent = "(empty list)";
wrap.appendChild(empty);
container.appendChild(wrap);
return;
}

arr.forEach((item, idx) => {
const row = document.createElement("div");
row.className = "row";
row.style.marginLeft = "24px";

row.appendChild(makeIconButton("✕", "Delete item", () => {
arr.splice(idx, 1);
syncToSource();
updateUI();
}, true));

const iLabel = document.createElement("span");
iLabel.className = "key-input";
iLabel.style.fontWeight = "900";
iLabel.style.color = "#666";
iLabel.style.minWidth = "46px";
iLabel.style.maxWidth = "46px";
iLabel.textContent = `${idx}:`;
row.appendChild(iLabel);

const pill = document.createElement("span");
pill.className = "type-pill";
pill.textContent = inferTypeLabel(item);
row.appendChild(pill);

if (Array.isArray(item)) {
wrap.appendChild(row);
const sub = document.createElement("div");
sub.style.marginLeft = "24px";
renderArray(item, sub, null);
wrap.appendChild(sub);
} else if (isPlainObject(item)) {
wrap.appendChild(row);
const sub = document.createElement("div");
sub.style.marginLeft = "24px";
renderObject(item, sub);
wrap.appendChild(sub);
} else {
const input = makeScalarEditor(item, (newVal) => {
arr[idx] = normalizeToJsonSafe(newVal);
scheduleSync();
});
row.appendChild(input);
wrap.appendChild(row);
}
});

container.appendChild(wrap);
}

function render() {
uiRoot.innerHTML = "";
updateNav();

const doc = safeCurrentDoc();

const toolbar = document.createElement("div");
toolbar.className = "toolbar";

const typePill = document.createElement("span");
typePill.className = "type-pill";
typePill.textContent = "root: " + inferTypeLabel(doc);

const addLabel = document.createElement("label");
addLabel.textContent = "Add:";

const addInput = document.createElement("input");
addInput.type = "text";
addInput.placeholder = isPlainObject(doc) ? "key name" : (Array.isArray(doc) ? "item value" : "key name");
addInput.style.width = "220px";

const addType = document.createElement("select");
["string","number","boolean","null","map","list"].forEach(t => {
const o = document.createElement("option");
o.value = t; o.textContent = t;
addType.appendChild(o);
});

const addBtn = document.createElement("button");
addBtn.className = "nav-btn";
addBtn.type = "button";
addBtn.textContent = isPlainObject(doc) ? "+ key" : (Array.isArray(doc) ? "+ item" : "Convert to map");
addBtn.onclick = () => {
const root = safeCurrentDoc();
const t = addType.value;
const name = addInput.value.trim();

const defaultValueForType = (type, seedStr) => {
switch (type) {
case "string": return String(seedStr ?? "");
case "number": {
const n = Number(seedStr);
return Number.isFinite(n) ? n : 0;
}
case "boolean": return seedStr === "true";
case "null": return null;
case "map": return {};
case "list": return [];
default: return String(seedStr ?? "");
}
};

if (isPlainObject(root)) {
if (!name) { setStatus("err", "Provide a key name."); return; }
if (Object.prototype.hasOwnProperty.call(root, name)) { setStatus("err", `Key "${name}" already exists.`); return; }
root[name] = normalizeToJsonSafe(defaultValueForType(t, ""));
} else if (Array.isArray(root)) {
root.push(normalizeToJsonSafe(defaultValueForType(t, name)));
} else {
const m = clone(OPTIONS.newDocTemplate);
const k = name || "key";
m[k] = normalizeToJsonSafe(defaultValueForType(t, ""));
allDocs[currentIndex] = m;
}

addInput.value = "";
setStatus("", "");
syncToSource();
updateUI();
};

const help = document.createElement("div");
help.className = "muted";
help.textContent = "JSON-safe. Leading-zero numbers stay strings. Null docs preserved. Escape cancels key rename.";

toolbar.appendChild(typePill);
toolbar.appendChild(document.createElement("span")).className = "spacer";
toolbar.appendChild(addLabel);
toolbar.appendChild(addInput);
toolbar.appendChild(addType);
toolbar.appendChild(addBtn);

uiRoot.appendChild(toolbar);
uiRoot.appendChild(help);

const rootWrap = document.createElement("div");
rootWrap.style.marginTop = "12px";
uiRoot.appendChild(rootWrap);

if (isPlainObject(doc)) renderObject(doc, rootWrap);
else if (Array.isArray(doc)) renderArray(doc, rootWrap, "(root list)");
else renderScalarRoot(rootWrap, doc);
}

function updateUI() { render(); }

function changeDoc(delta) {
const next = currentIndex + delta;
if (next < 0 || next >= allDocs.length) return;
currentIndex = next;
updateUI();
}

function addNewDoc() {
allDocs.push(clone(OPTIONS.newDocTemplate)); // kind: unknown
currentIndex = allDocs.length - 1;
syncToSource();
updateUI();
}

function deleteCurrentDoc() {
if (allDocs.length <= 1) return;
allDocs.splice(currentIndex, 1);
if (currentIndex >= allDocs.length) currentIndex = allDocs.length - 1;
syncToSource();
updateUI();
}

function formatYaml() {
syncToSource();
setStatus("ok", "Formatted YAML.");
setTimeout(() => setStatus("", ""), 900);
}

prevBtn.addEventListener("click", () => changeDoc(-1));
nextBtn.addEventListener("click", () => changeDoc(1));
newDocBtn.addEventListener("click", addNewDoc);
delDocBtn.addEventListener("click", deleteCurrentDoc);
formatBtn.addEventListener("click", formatYaml);

source.addEventListener("input", refreshFromSource);

// Init
refreshFromSource();
syncToSource(); // normalize on load
})();
</script>

</body>
</html>
