    <div class="description">
        <h1>File Encryptor</h1>
        <p>Enter a password and upload any file.<br>
        Download a self-decrypting HTML file.<br>
        Open it in any browser with the same password.<br>
        Your files never leave your device.<br>
        No app, no account, works offline.</p>
    </div>
    <script type="text/javascript">
    var controls = document.createElement('div');
    controls.className = 'controls';
    var pin = document.createElement('input');
        pin.type = 'password';
        pin.autocomplete = 'off';
        pin.placeholder = 'Enter password';
    var lbl = document.createElement('button');
        lbl.type = 'button';
        lbl.textContent = 'show';
    lbl.onclick = function() {
        if (pin.type === 'password') {
            pin.type = 'text';
            lbl.textContent = 'hide';
        } else {
            pin.type = 'password';
            lbl.textContent = 'show';
        }
    }
    var fileLabel = document.createElement('label');
    fileLabel.className = 'file-label';
    fileLabel.textContent = 'Choose file to encrypt';
    var file = document.createElement('input');
        file.type = 'file';
    fileLabel.appendChild(file);
    var status = document.createElement('div');
    status.className = 'status';
    file.onchange = function(event) {
        if (event.target.files.length === 0) return;
        var filename = event.target.files[0].name;
        fileLabel.textContent = 'encrypting...';
        fileLabel.appendChild(file);
        var filereader = new FileReader();
        filereader.onload = function(loadedEvent) {
            setTimeout(function() {
            var b64 = window.atob(document.querySelector('#template').getAttribute('data-b64')).split('----encrypted----');
            var saltB64 = random(32);
            var nonceB64 = random(8);
            var digest = window.btoa(pin.value);
            var derivedKey = pbkdf2Sha512(digest, saltB64, 10000);
            var keyBytes = window.atob(derivedKey);
            var encKeyB64 = window.btoa(keyBytes.substring(0, 32));
            var macKeyB64 = window.btoa(keyBytes.substring(32, 64));
            streamCipher.seed(encKeyB64, nonceB64);
            var dataurl = loadedEvent.target.result;
            var arr = dataurl.split(','),
            mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]),
            n = bstr.length,
            u8arr = new Uint8Array(n);
            for (var i=0; i < n; i++) {
                u8arr[i] = streamCipher.next() ^ bstr.charCodeAt(i);
            }
            var ciphertextStr = '';
            for (var i = 0; i < u8arr.length; i++) ciphertextStr += String.fromCharCode(u8arr[i]);
            var macInput = window.btoa(window.atob(saltB64) + window.atob(nonceB64) + ciphertextStr);
            var mac = hmacSha512(macKeyB64, macInput);
            var blob = new Blob([u8arr], {type:mime});
            var reader = new FileReader();
            reader.onload = function(e) {
                var tmp = 'data:text/html;base64,'.concat(window.btoa(''.concat(
                    b64[0],
                    e.target.result,
                    '" data-filename="', filename,
                    '" data-salt="', saltB64,
                    '" data-nonce="', nonceB64,
                    '" data-mac="', mac,
                    b64[1]
                )));
                download(tmp, filename + '.html');
                fileLabel.textContent = 'Choose file to encrypt';
                fileLabel.appendChild(file);
                status.textContent = filename + '.html downloaded';
            }
            reader.readAsDataURL(blob);
            }, 50);
        }
        filereader.readAsDataURL(event.target.files[0]);
        file.value = '';
    }

    controls.appendChild(pin);
    controls.appendChild(lbl);
    document.body.appendChild(controls);
    document.body.appendChild(fileLabel);
    document.body.appendChild(status);
</script>
