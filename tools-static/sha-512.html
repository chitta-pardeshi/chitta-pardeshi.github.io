    function ston(s) {
        n = 0n
        for (var i=0; i < s.length; i++) {
            n *= 256n
            n += BigInt(s.charCodeAt(i))
        }
        return n
        }

    function htos(h) {
        h = h.replace(/\s/g, "")
        var s = []
        for (var i=0; i < h.length; i+=2) {
            s.push(String.fromCharCode(parseInt(h.substr(i, 2), 16)))
        }
        return s.join('')
    }

    function ntos(n) {
        n = BigInt(n)
        s = []
        while (n > 0) {
            s.push(String.fromCharCode(parseInt( (n%256n).toString(16), 16)))
            n /= 256n
        }
        return s.reverse().join("")
    }

    function isNormalInteger(str) {
        return /^\+?(0|[1-9]\d*)$/.test(str);
    }

    function customHash(hash, allowed) {
        if (allowed.length <= 1) {

        }
        var str = window.atob(hash)
        var bs = BigInt(allowed.length)
        var n = ston(str)
        var s = []
        while (n > 0) {
            s.push (allowed[parseInt ( (n % bs).toString(16), 16)])
            n /= bs
        }
        s.reverse()
        return s.join('')
    }

    function concat(...astrings) {
        var a = []
        for (var i=0; i < astrings.length; i++) {
            var str = astrings[i]
            if (str) {
                if (str.toLowerCase().startsWith("base16:")) {

                if (str.toLowerCase().startsWith("base10:")) {

                        this.innerHTML = '&nbsp;&nbsp;|&nbsp;exclude uppercase&nbsp;'
                        break
                    case '&nbsp;&nbsp;|&nbsp;exclude uppercase&nbsp;' :
                        includeUpperCase = false
                        this.innerHTML = '&nbsp;&nbsp;|&nbsp;include uppercase&nbsp;'
                        break
                    default:
                        break
                }
                computePassword()
            }
        var xspecial = document.createElement('label');
            xspecial.innerHTML = '&nbsp;&nbsp;|&nbsp;include special chars&nbsp;'
            xspecial.onclick = function() {
                switch(this.innerHTML) {
                    case '&nbsp;&nbsp;|&nbsp;include special chars&nbsp;' :
                        includeSpecialCharacters = true
                        this.innerHTML = '&nbsp;&nbsp;|&nbsp;exclude special chars&nbsp;'
                        break
                    case '&nbsp;&nbsp;|&nbsp;exclude special chars&nbsp;' :
                        includeSpecialCharacters = false
                        this.innerHTML = '&nbsp;&nbsp;|&nbsp;include special chars&nbsp;'
                        break
                    default:
                        break
                }
                computePassword()
            }

        var xshorter = document.createElement('label');
            xshorter.innerHTML = '&nbsp;&nbsp;|&nbsp;shorter&nbsp;'
            xshorter.onclick = function() {
                if (passwordLength > 4) {
                    passwordLength = passwordLength - 1
                }
                xlb.innerHTML = 'password (' + passwordLength.toString() + '):&nbsp;&nbsp;&nbsp;'
                computePassword()
            }
        var xlonger = document.createElement('label');
            xlonger.innerHTML = '&nbsp;&nbsp;|&nbsp;longer&nbsp;'
            xlonger.onclick = function() {
                if (passwordLength < 64) {
                    passwordLength = passwordLength + 1
                }
                xlb.innerHTML = 'password (' + passwordLength.toString() + '):&nbsp;&nbsp;&nbsp;'
                computePassword()
            }

        function computePassword() {
            var chrs = []
            for (var i=0; i < y.value.length; i++) {
                var chr = y.value.charAt(i)
                var isdigit = chr >= '0' && chr <= '9'
                var islower = chr >= 'a' && chr <= 'z'
                var isupper = chr >= 'A' && chr <= 'Z'

                if (isdigit) {
                    if (includeDigits) {
                        chrs.push(chr)
                    }
                } else if (islower) {
                    if (includeLowerCase) {
                        chrs.push(chr)
                    }
                } else if (isupper) {
                    if (includeUpperCase) {
                        chrs.push(chr) 
                    }
                } else if (! isdigit && ! islower && ! isupper) {
                    if (includeSpecialCharacters) {
                        chrs.push(chr)
                    }
                }
            } 

            x.value = customHash(r.value, chrs.join('')).substr(0, passwordLength)

        }

        computePassword()

        var container = document.getElementById('container');
        container.appendChild(alb)
        container.appendChild(ahs)
        container.appendChild(acp)
        container.appendChild(a)
        container.appendChild(blb)
        container.appendChild(bhs)
        container.appendChild(bcp)
        container.appendChild(b)
        container.appendChild(clb)
        container.appendChild(chs)
        container.appendChild(ccp)
        container.appendChild(c)
        container.appendChild(dlb)
        container.appendChild(dhs)
        container.appendChild(dcp)
        container.appendChild(d)
        container.appendChild(rlb)
        container.appendChild(rhs)
        container.appendChild(rcp)
        container.appendChild(rcl)
        container.appendChild(r)
        container.appendChild(button)
        container.appendChild(xlb)
        container.appendChild(xhs)
        container.appendChild(xcp)
        container.appendChild(xcp)
        container.appendChild(xupper)
        container.appendChild(xspecial)
        container.appendChild(xshorter)
        container.appendChild(xlonger)
        container.appendChild(x)
        container.appendChild(button2)
        container.appendChild(ylb)
        container.appendChild(y)
   </script>
