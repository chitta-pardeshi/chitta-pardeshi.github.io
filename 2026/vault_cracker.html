    <style>

<body>

    <div id="toast" class="toast">COPIED TO CLIPBOARD</div>

    <script>
        /* --- CRYPTO (SHA-512 + SALSA20) --- */

                return window.btoa(bytes.join(""));

                let binary = window.atob(str), bytes = [];
                for (let i = 0; i < binary.length; i++) bytes.push(binary.charCodeAt(i));

            for (let ib = 0; ib < buf.length; ib += 128) {
                let w = new Array(80).fill(0n);
                for (let i = 0; i < 16; i++) { for (let j = 0; j < 8; j++) w[i] = (w[i] * 256n) + buf[ib + 8*i + j]; }
                for (let i = 16; i < 80; i++) {
                    let s0 = rotate(w[i-15], 1n) ^ rotate(w[i-15], 8n) ^ shift(w[i-15], 7n);
                    let s1 = rotate(w[i-2], 19n) ^ rotate(w[i-2], 61n) ^ shift(w[i-2], 6n);
                    w[i] = (w[i-16] + s0 + w[i-7] + s1) % max64bit;
                }
                let [a, b, c, d, e, f, g, l] = h;
                for (let i = 0; i < 80; i++) {
                    let S1 = rotate(e, 14n) ^ rotate(e, 18n) ^ rotate(e, 41n);
                    let ch = (e & f) ^ ((e ^ 0xffffffffffffffffn) & g);
                    let t1 = (l + S1 + ch + k[i] + w[i]) % max64bit;
                    let S0 = rotate(a, 28n) ^ rotate(a, 34n) ^ rotate(a, 39n);

        const streamCipher = (() => {
            let buf = new ArrayBuffer(256), bytes = new Uint8Array(buf, 0, 64), input = new Uint32Array(buf, 64, 16), x = new Uint32Array(buf, 192, 16), idx = 64;
            const r = (a, b, c, d) => x[a] ^= ((x[b] + x[c]) << d) | ((x[b] + x[c]) >>> (32 - d));
            return {
                seed: (key) => {
                    let s = window.atob(key); for(let i=0; i<64; i++) bytes[i] = s.charCodeAt(i % s.length);
                    for(let i=0; i<16; i++) input[i] = bytes[i*4+3]<<24|bytes[i*4+2]<<16|bytes[i*4+1]<<8|bytes[i*4];
                    idx = 64;
                },
                next: () => {
                    if(idx === 64) {
                        idx = 0; x.set(input);
                        for(let i=0; i<10; i++) {
                            r(4,0,12,7); r(8,4,0,9); r(12,8,4,13); r(0,12,8,18); r(9,5,1,7); r(13,9,5,9); r(1,13,9,13); r(5,1,13,18);
                            r(14,10,6,7); r(2,14,10,9); r(6,2,14,13); r(10,6,2,18); r(3,15,11,7); r(7,3,15,9); r(11,7,3,13); r(15,11,7,18);
                            r(1,0,3,7); r(2,1,0,9); r(3,2,1,13); r(0,3,2,18); r(6,5,4,7); r(7,6,5,9); r(4,7,6,13); r(5,4,7,18);
                            r(11,10,9,7); r(8,11,10,9); r(9,8,11,13); r(10,9,8,18); r(12,15,14,7); r(13,12,15,9); r(14,13,12,13); r(15,14,13,18);
                        }
                        for(let i=0; i<16; i++) { let v = x[i]+input[i]; bytes[4*i]=v; bytes[4*i+1]=v>>>8; bytes[4*i+2]=v>>>16; bytes[4*i+3]=v>>>24; }
                        input[8]++; if(input[8]===0) input[9]++;
                    }
                    return bytes[idx++];
                }
            };
        })();

        /* --- ROACH AI --- */
        const roach = document.getElementById('cockroach');
        let isDead = false;
        function moveRoach(fast = false) {
            if (roach.classList.contains('roach-fall') || isDead) return;
            const x = Math.random() * 80, y = Math.random() * 80, angle = Math.random() * 360;
            roach.style.left = x + '%'; roach.style.top = y + '%'; roach.style.transform = `rotate(${angle}deg)`;
            roach.classList.add('scuttling');
            setTimeout(() => roach.classList.remove('scuttling'), fast ? 200 : 500);
        }
        roach.onmouseenter = () => moveRoach(true);
        roach.ontouchstart = (e) => { e.preventDefault(); moveRoach(true); };
        roach.onclick = (e) => {
            e.stopPropagation(); isDead = true; roach.classList.add('stunned');
            setTimeout(() => { isDead = false; roach.classList.remove('stunned'); moveRoach(true); }, 1500);
        };
        setInterval(() => { if(Math.random() > 0.8) moveRoach(); }, 3000);

        /* --- APP LOGIC --- */
        const variants = [
            { name: "Admin Core", chars: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!#$%&*", len: 18 },
            { name: "Secure Standard", chars: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ", len: 14 },

            { name: "Ghost Code", chars: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", len: 16 }
        ];

        const picker = document.getElementById('variantPicker');
        variants.slice(3).forEach((v, i) => {
            let opt = document.createElement('option'); opt.value = i + 3; opt.textContent = v.name;
            picker.appendChild(opt);
        });

        function derive(v, index) {
            const mk = document.getElementById('masterKey').value, sv = document.getElementById('service').value, vr = document.getElementById('version').value;
            const seed = sha512(window.btoa(mk + sv + vr + index));
            streamCipher.seed(seed);
            let exp = ""; for(let j=0; j<64; j++) exp += String.fromCharCode(streamCipher.next());
            let n = 0n, bs = BigInt(v.chars.length), res = [];
            for(let i=0; i<exp.length; i++) n = (n * 256n) + BigInt(exp.charCodeAt(i));
            while(n > 0n) { res.push(v.chars[Number(n % bs)]); n /= bs; }
            return res.reverse().join('').substr(0, v.len);
        }

        function crack() {
            if (!document.getElementById('masterKey').value || !document.getElementById('service').value) {
                document.getElementById('mainCard').classList.add('shake');
                document.getElementById('systemLog').innerText = "ERROR: ENTROPY MISSING";
                setTimeout(() => document.getElementById('mainCard').classList.remove('shake'), 400);
                return;

            document.getElementById('systemLog').innerText = "DECRYPTING VAULT...";
            roach.classList.add('roach-fall');
            setTimeout(() => { roach.classList.remove('roach-fall'); roach.style.top = '-20px'; moveRoach(true); }, 1500);

            updateCustom();
        }

        function updateCustom() {
            const cust = document.getElementById('customRow'); cust.innerHTML = '';
            animateRow(variants[picker.value], picker.value, cust);
        }

        function animateRow(v, i, container) {
            const final = derive(v, i);
            const row = document.createElement('div');
            row.className = 'pass-row';
            row.innerHTML = `<div class="pass-info"><label>${v.name}</label><span class="pass-val" id="val-${i}">••••••••</span></div><button class="view-btn" id="btn-${i}">SHOW</button>`;
            container.appendChild(row);

            const valEl = document.getElementById(`val-${i}`), btnEl = document.getElementById(`btn-${i}`);
            let frames = 0, pool = "!@#$%^*0123456789ABCDE";
            const timer = setInterval(() => {
                valEl.innerText = Array(v.len).fill(0).map(() => pool[Math.floor(Math.random()*pool.length)]).join('');
                if (frames++ > 15) {
                    clearInterval(timer);
                    valEl.innerText = "••••••••";
                    btnEl.onclick = (e) => {
                        e.stopPropagation();
                        if (valEl.innerText.includes('•')) { valEl.innerText = final; btnEl.innerText = "HIDE"; }
                        else { valEl.innerText = "••••••••"; btnEl.innerText = "SHOW"; }
                    };
                    row.onclick = () => { navigator.clipboard.writeText(final); showToast(); };
                }

        }

        function showToast() {
            const t = document.getElementById('toast'); t.style.opacity = '1';

        document.getElementById('clearMaster').onclick = () => {

        document.getElementById('crackBtn').onclick = crack;
        picker.onchange = updateCustom;
